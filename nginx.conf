server {
    listen 80;
    server_name crm.eclectic.co.id localhost;
    server_tokens off;

    # 1. PENGAMANAN HEADERS UNTUK ASET STATIS (STATIC ASSET SHIELD)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http://localhost:8081 https://crm.eclectic.co.id; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;" always;

    # 2. MELAYANI BERKAS STATIS SVELTEKIT (SPA FALLBACK)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 3. PROKSI BALIK OTOMATIS KE WADAH GOLANG BACKEND
    location /api/ {
        proxy_pass http://backend:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
    # 4. OPTIMASI SINGGAHAN (CACHE) BERKAS STATIS
    # Mengecualikan env.js agar perubahan environment bisa langsung terbaca
    location ~* ^/(?!_app/env\.js).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
